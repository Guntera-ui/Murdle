<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kako Cypher</title>

    <link
        rel="stylesheet"
        href="style.css?v=22"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
        rel="stylesheet"
    >

    <link
        rel="icon"
        href="assets/favicon.svg"
        type="image/svg+xml"
    >

</head>

<body>

    <div class="main-layout">

        <aside class="sidebar">

            <section class="case-section">

                <header id="case-file-header">

                    <h2>
                        Case File
                    </h2>

                    <div id="case-file-number"></div>

                    <h3 id="case-title"></h3>

                    <div id="case-meta">

                        <div id="case-victim"></div>

                        <div id="case-status-line"></div>

                    </div>

                </header>

                <div id="case-file-content">

                    <section
                        id="incident-section"
                        aria-label="Incident report"
                    ></section>

                    <section
                        id="interviews-section"
                        aria-label="Witness interviews"
                    ></section>

                    <section class="case-subsection">

                        <h2 class="case-heading">
                            Clues &amp; Evidence
                        </h2>

                        <ol id="clues"></ol>

                    </section>

                    <section class="final-accusation-section">

                        <h2 class="case-heading">
                            Final Accusation
                        </h2>

                        <section
                            id="accusation"
                            aria-label="Final accusation form"
                        ></section>

                    </section>

                </div>

            </section>

        </aside>

        <main class="grid-area">

            <div class="board-workspace">

                <section
                    class="deduction-board-section"
                    aria-labelledby="deduction-board-title"
                >

                    <h2
                        id="deduction-board-title"
                        class="board-title"
                    >
                        Deduction Board
                    </h2>

                    <div id="master-grid"></div>

                </section>

                <section
                    class="board-reference"
                    aria-labelledby="case-reference-title"
                >

                    <h2
                        id="case-reference-title"
                        class="board-reference-title"
                    >
                        Case Reference
                    </h2>

                    <div id="categories"></div>

                </section>

            </div>

        </main>

    </div>

    <div
        id="end-screen"
        class="hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="end-title"
        aria-describedby="end-message"
    >

        <article id="case-file">

            <div
                class="case-status-pill"
                aria-hidden="true"
            ></div>

            <h2 id="end-title"></h2>

            <p id="end-message"></p>

            <section
                id="end-details"
                aria-label="Case findings"
            ></section>

            <button
                id="end-button"
                type="button"
            ></button>

        </article>

    </div>

    <script src="js/icons.js?v=21"></script>
    <script src="js/utils.js?v=20"></script>
    <script src="js/state.js?v=20"></script>
    <script src="js/render.js?v=20"></script>
    <script src="js/matrix.js?v=20"></script>
    <script src="js/board.js?v=20"></script>
    <script src="js/api.js?v=20"></script>
    <script src="js/game.js?v=26"></script>
    <script src="js/dropdown.js?v=20"></script>
    <script src="js/endScreen.js?v=20"></script>
    <script src="js/timer.js?v=20"></script>
    <script src="js/renderAccusation.js?v=20"></script>
    <script src="js/app.js?v=20"></script>

</body>

</html>
