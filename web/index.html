<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;600;700&family=Metamorphous&display=swap"
        rel="stylesheet"
    >
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Kako Cypher</title>

    <link
        rel="stylesheet"
        href="/home.css?v=4"
    >
</head>

<body>
    <main class="archive-gateway">
        <header class="gateway-header">
            <p class="gateway-eyebrow">
                Kako Cypher
            </p>

            <h1>
                Choose an Archive
            </h1>

            <p class="gateway-description">
                Enter a collection of murder mysteries
                shaped by a distinct world and atmosphere.
            </p>

            <a
    class="mystery-builder-button"
    href="/create-case.html"
>
    <span class="mystery-builder-kicker">
        Case Workshop
    </span>

    <strong>
        Create Your Own Mystery
    </strong>

    <span class="mystery-builder-action">
        Open the case editor
    </span>
</a>
        </header>

        <section
            id="archive-choices"
            class="archive-choices"
            aria-label="Mystery archives"
            aria-live="polite"
        >
            <p class="archive-loading-message">
                Loading archives...
            </p>
        </section>
    </main>

    <script
        type="module"
        src="/js/home.js?v=4"
    ></script>
</body>
</html>
